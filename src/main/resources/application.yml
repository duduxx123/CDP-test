spring:
  application:
    name: cdp-test-demo

server:
  port: 8080

# ─── 应用配置 ─────────────────────────────────────────────
app:
  # 运行模式: api (Web 服务) | cli (启动时自动搜索 + Web 服务)
  mode: api

  chrome:
    # Chrome 远程调试端口
    port: 9222
    # Chrome 可执行文件路径
    executable: C:/Program Files/Google/Chrome/Application/chrome.exe

  search:
    # 默认搜索关键词
    query: "魔法少女小圆"
    # 默认返回条数
    count: 10

  douyin:
    # 发表评论前检查登录状态
    check-login: true
    # 模拟人类打字延迟基准值（毫秒）
    typing-delay-ms: 100
    # 评论提取最大滚动轮数
    max-scroll-rounds: 20
    dm:
      # 发送私信后等待确认时间（毫秒）
      send-wait-ms: 2000
      # 私信输入框等待超时（毫秒）
      input-timeout-ms: 10000
